name: Daily Engineering Pulse

on:
  schedule:
    # Runs every day at 04:00 UTC (9:30 AM IST)
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update daily engineering log
        run: |
          mkdir -p .github/logs
          echo "Pulse logged on $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> .github/logs/pulse.log
          tail -n 100 .github/logs/pulse.log > .github/logs/pulse.log.tmp && mv .github/logs/pulse.log.tmp .github/logs/pulse.log

      - name: Commit and push daily contribution
        run: |
          git config user.name "Livesh L"
          git config user.email "liveshjaidj@gmail.com"
          git add .github/logs/pulse.log
          git commit -m "chore(pulse): daily engineering activity sync [skip ci]" || echo "No changes to commit"
          git push origin main
