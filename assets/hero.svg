<svg width="1400" height="650" viewBox="0 0 1400 650" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".5" stop-color="#0B1530"/><stop offset="1" stop-color="#160D2B"/></linearGradient>
<linearGradient id="rainbow" x1="0" x2="1"><stop stop-color="#38BDF8"/><stop offset=".38" stop-color="#6366F1"/><stop offset=".68" stop-color="#A855F7"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<radialGradient id="b"><stop stop-color="#38BDF8" stop-opacity=".4"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
<radialGradient id="v"><stop stop-color="#A855F7" stop-opacity=".34"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#94A3B8" stroke-opacity=".09"/></pattern>
</defs>
<rect width="1400" height="650" rx="34" fill="url(#bg)"/><rect width="1400" height="650" rx="34" fill="url(#grid)"/>
<circle cx="180" cy="130" r="280" fill="url(#b)"/><circle cx="1190" cy="160" r="310" fill="url(#v)"/>
<g fill="none" stroke="#38BDF8" stroke-opacity=".18">
<path d="M820 80C1040 0 1190 90 1370 30"/><path d="M780 120C1010 40 1170 160 1390 90"/>
</g>
